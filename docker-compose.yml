services:
  nextchapter:
    image: ghcr.io/keshavsapra/nextchapter:latest
    container_name: nextchapter
    restart: unless-stopped
    ports:
      - 8080:8080/tcp
    volumes:
      - /path/to/media:/media # PDF and EPUB library
      - /path/to/covers:/covers # Extracted cover images
      - /path/to/thumbnails:/thumbnails # Page thumbnails for OpenGraph previews
      - /path/to/config:/config # User data: pins, collections, settings, full-text search index, optional auth files. Persist to avoid re-indexing on restart.
    environment:
      - MEDIA_DIR=/media
      - IMAGE_DIR=/covers
      - THUMBNAIL_DIR=/thumbnails
      - CONFIG_DIR=/config
      - BIND_ADDR=0.0.0.0
      - BIND_PORT=8080
      - SCAN_INTERVAL=600
      - TEXT_INDEX_ENABLED=true # Set to false to skip full-text indexing (PDF/EPUB) if filename search is enough
      # Optional: Uncomment if using Firebase Authentication
      # - FIREBASE_CONFIG_PATH=/config/firebase.json
      # - FIREBASE_WHITELIST=/config/whitelist.cfg
    # If your host directories show 'Permission denied (os error 13)', uncomment the line below:
    # user: "0:0"
