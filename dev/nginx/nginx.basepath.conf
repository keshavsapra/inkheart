worker_processes 2;
user www-data;

events {
    use epoll;
    worker_connections 128;
}

http {
    server_tokens off;
    include mime.types;
    charset utf-8;

    server {
        listen 80;
        server_name localhost;

        # Root path - can show a test page or redirect
        location = / {
            return 200 "Root server. Try /pdfs for nextchapter\n";
            add_header Content-Type text/plain;
        }

        # Serve nextchapter from /pdfs subdirectory
        location /pdfs {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend API routes under /pdfs
        location ~ ^/pdfs/(api|cover|thumbnail) {
            rewrite ^/pdfs/(api|cover|thumbnail)(.*)$ /$1$2 break;
            proxy_pass http://nextchapter:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}